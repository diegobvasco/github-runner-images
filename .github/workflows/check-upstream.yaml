name: Check upstream runner image

on:
  schedule:
    # Daily at 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the upstream image is unchanged
        type: boolean
        required: false
        default: false

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}

    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect upstream image drift
        id: check
        env:
          OWNER: ${{ github.repository_owner }}
          FORCE: ${{ inputs.force }}
        run: scripts/check-upstream.sh >> "$GITHUB_OUTPUT"

  rebuild:
    needs: check
    # --force is folded into the check script, which reports changed=true.
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Dispatch Build Images workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: gh workflow run build.yaml --ref "${REF}"
