name: Build Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'

  pull_request:
    paths:
      - 'images/**'

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi

          if [[ "$BASE" == "$HEAD" ]]; then
            BASE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fi

          declare -A images

          while read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" =~ ^images/base/ ]]; then
              while read -r dockerfile; do
                images[$(dirname "$dockerfile")]=1
              done < <(find images -name Dockerfile)
            elif [[ "$file" =~ ^images/([^/]+)/([^/]+)/ ]]; then
              dir="images/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"

              if [[ -f "$dir/Dockerfile" ]]; then
                images[$dir]=1
              fi
            fi
          done < <(git diff --name-only "$BASE" "$HEAD")

          matrix=$(
            printf '%s\n' "${!images[@]}" \
              | sort \
              | jq -R 'select(length > 0)' \
              | jq -cs '{path: .}'
          )

          echo "$matrix"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare

    if: ${{ fromJson(needs.prepare.outputs.matrix).path[0] != null }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          TAG=$(echo "${{ matrix.path }}" | sed 's|^images/||' | tr -d '/')

          docker buildx build \
            "${{ matrix.path }}" \
            --tag ghcr.io/${{ github.repository_owner }}/github-runner:$TAG \
            --load