name: Build Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'

  pull_request:
    paths:
      - 'images/**'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      has_base: ${{ steps.matrix.outputs.has_base }}
      images: ${{ steps.matrix.outputs.images }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi

          scripts/needs-build.sh --base "$base" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build-base:
    needs: prepare

    if: ${{ needs.prepare.outputs.has_base == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: ${{ github.event_name != 'pull_request' }}

      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export base image
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/build-image.sh images/base --tag base --save "${RUNNER_TEMP}/base-image.tar.gz"

      - name: Upload base image artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: base-image
          path: ${{ runner.temp }}/base-image.tar.gz
          retention-days: 1

      - name: Build and push base image
        if: ${{ github.event_name != 'pull_request' }}
        run: scripts/build-image.sh images/base --tag base --push

  build-images:
    needs: [prepare, build-base]

    if: ${{ always() && fromJson(needs.prepare.outputs.images).path[0] != null }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.images) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: ${{ github.event_name != 'pull_request' }}

      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download base image built in this PR
        if: ${{ github.event_name == 'pull_request' && needs.prepare.outputs.has_base == 'true' && needs.build-base.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: base-image
          path: ${{ runner.temp }}

      - name: Load base image built in this PR
        if: ${{ github.event_name == 'pull_request' && needs.prepare.outputs.has_base == 'true' && needs.build-base.result == 'success' }}
        run: docker load --input "${RUNNER_TEMP}/base-image.tar.gz"

      - name: Build image
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/build-image.sh "${{ matrix.path }}"

      - name: Build and push image
        if: ${{ github.event_name != 'pull_request' }}
        run: scripts/build-image.sh "${{ matrix.path }}" --push
