name: Build Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'

  pull_request:
    paths:
      - 'images/**'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      has_base: ${{ steps.matrix.outputs.has_base }}
      images: ${{ steps.matrix.outputs.images }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" || "$BASE" == "$HEAD" ]]; then
            BASE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fi

          declare -A images

          while read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" =~ ^images/base/ ]]; then
              while read -r dockerfile; do
                images[$(dirname "$dockerfile")]=1
              done < <(find images -name Dockerfile)
            elif [[ "$file" =~ ^images/([^/]+)/([^/]+)/ ]]; then
              dir="images/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"

              if [[ -f "$dir/Dockerfile" ]]; then
                images[$dir]=1
              fi
            fi
          done < <(git diff --name-only "$BASE" "$HEAD")

          has_base=false
          image_list=()
          for dir in $(printf '%s\n' "${!images[@]}" | sort); do
            if [[ "$dir" == "images/base" ]]; then
              has_base=true
            else
              image_list+=("$dir")
            fi
          done

          images_json=$(
            printf '%s\n' "${image_list[@]}" \
              | sort \
              | jq -R 'select(length > 0)' \
              | jq -cs '{path: .}'
          )

          echo "has_base=$has_base"
          echo "images=$images_json"

          echo "has_base=$has_base" >> "$GITHUB_OUTPUT"
          echo "images=$images_json" >> "$GITHUB_OUTPUT"

  build-base:
    needs: prepare

    if: ${{ needs.prepare.outputs.has_base == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: ${{ github.event_name != 'pull_request' }}

      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export base image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build \
            --tag "ghcr.io/${{ github.repository_owner }}/github-runner:base" \
            images/base

          docker save \
            "ghcr.io/${{ github.repository_owner }}/github-runner:base" \
            | gzip > "${RUNNER_TEMP}/base-image.tar.gz"

      - name: Upload base image artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: base-image
          path: ${{ runner.temp }}/base-image.tar.gz
          retention-days: 1

      - name: Build and push base image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker buildx build \
            images/base \
            --tag ghcr.io/${{ github.repository_owner }}/github-runner:base \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push

  build-images:
    needs: [prepare, build-base]

    if: ${{ always() && fromJson(needs.prepare.outputs.images).path[0] != null }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.images) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: ${{ github.event_name != 'pull_request' }}

      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download base image built in this PR
        if: ${{ github.event_name == 'pull_request' && needs.prepare.outputs.has_base == 'true' && needs.build-base.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: base-image
          path: ${{ runner.temp }}

      - name: Load base image built in this PR
        if: ${{ github.event_name == 'pull_request' && needs.prepare.outputs.has_base == 'true' && needs.build-base.result == 'success' }}
        run: docker load --input "${RUNNER_TEMP}/base-image.tar.gz"

      - name: Build image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          TAG=$(echo "${{ matrix.path }}" | sed 's|^images/||' | tr -d '/')

          docker build \
            --tag "ghcr.io/${{ github.repository_owner }}/github-runner:$TAG" \
            "${{ matrix.path }}"

      - name: Build and push image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          TAG=$(echo "${{ matrix.path }}" | sed 's|^images/||' | tr -d '/')

          docker buildx build \
            "${{ matrix.path }}" \
            --tag ghcr.io/${{ github.repository_owner }}/github-runner:$TAG \
            --cache-from type=gha,scope=$TAG \
            --cache-to type=gha,scope=$TAG,mode=max \
            --push
